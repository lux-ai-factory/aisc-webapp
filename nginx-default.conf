# Nginx Configuration for A4S webapp

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy allauth endpoints to backend (same-origin, avoids CORS)
    location /_allauth/ {
        proxy_pass http://a4s-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy OIDC callback URLs to backend
    location /accounts/ {
        proxy_pass http://a4s-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html =404;
    }
}